<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — Indústria de Estética Médica (2015–2025)</title>
<style>
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --surface-2:#f3f2ee;
  --text-1:#0b0b0b; --text-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,0.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s1-wash:rgba(42,120,214,.10);
  --good:#006300; --bad:#d03b3b; --warn-bg:#fff6dc; --warn-ink:#6b4a00;
  --neutral-cell:#ebeae5; --accent:#2a78d6;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --surface-2:#232321;
  --text-1:#f0efec; --text-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,0.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s1-wash:rgba(57,135,229,.12);
  --good:#0ca30c; --bad:#e66767; --warn-bg:#2e2510; --warn-ink:#f2cf7a;
  --neutral-cell:#2a2a28; --accent:#3987e5;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--text-1);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45}
button,select,input{font:inherit;color:inherit}
a{color:var(--accent)}
header.top{position:sticky;top:0;z-index:20;background:var(--page);border-bottom:1px solid var(--border)}
.top-row{display:flex;align-items:center;gap:16px;padding:12px 24px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0;font-weight:650}
.brand .sub{color:var(--text-2);font-size:12.5px}
.top-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.07)}
.btn.small{padding:3px 8px;font-size:12px;border-radius:6px}
.src-status{font-size:12px;color:var(--text-2);max-width:340px}
nav.tabs{display:flex;gap:2px;padding:0 20px;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer;color:var(--text-2);border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--text-1);border-bottom-color:var(--accent);font-weight:600}
.filters{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding:10px 24px;border-top:1px solid var(--border);background:var(--surface)}
.fgroup{display:flex;align-items:center;gap:6px;transition:opacity .15s}
.fgroup.inactive{opacity:.38}
.fgroup > label.fl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-right:2px}
select{border:1px solid var(--border);background:var(--surface);border-radius:6px;padding:4px 6px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:3px 10px;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--s1-wash);border-color:var(--accent);font-weight:600}
.chip .dot{width:8px;height:8px;border-radius:50%}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:4px 10px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--s1-wash);font-weight:600}
main{padding:20px 24px 60px;max-width:1500px;margin:0 auto}
.page-filters{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin:0 0 16px;padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.page-filters .ttl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-6{grid-column:span 6}.span-4{grid-column:span 4}.span-3{grid-column:span 3}.span-2{grid-column:span 2}
@media (max-width:1100px){.span-8,.span-6,.span-4{grid-column:span 12}.span-3,.span-2{grid-column:span 6}}
@media (max-width:640px){header.top{position:static}.span-3,.span-2{grid-column:span 12}.top-row,.filters,main{padding-left:12px;padding-right:12px}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;min-width:0}
.card-h{display:flex;gap:8px;align-items:flex-start}
.card-h h3{margin:0;font-size:14.5px;font-weight:620}
.card-h .q{color:var(--text-2);font-size:12.5px;margin-top:2px}
.card-h .tools{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
.chart-wrap{position:relative;height:290px;margin-top:10px}
.chart-wrap.tall{height:360px}.chart-wrap.short{height:220px}.chart-wrap.xs{height:180px}
.card .note{font-size:12px;color:var(--text-2);margin-top:8px}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--text-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px}
.legend i.box{width:10px;height:10px;border-radius:2px}
.legend i.hollow{width:9px;height:9px;border-radius:50%;border:2px solid var(--text-2);background:transparent}
.legend i.fill{width:9px;height:9px;border-radius:50%;background:var(--text-2)}
.kpi{display:flex;flex-direction:column;gap:4px}
.kpi .lbl{font-size:12.5px;color:var(--text-2)}
.kpi .val{font-size:26px;font-weight:650;letter-spacing:-.01em}
.kpi .val.hero{font-size:48px;line-height:1.05}
.kpi .delta{font-size:12.5px;color:var(--text-2)}
.kpi .delta.up{color:var(--good)}.kpi .delta.down{color:var(--bad)}
.kpi .flag{font-size:11.5px;color:var(--warn-ink);background:var(--warn-bg);border-radius:4px;padding:1px 6px;align-self:flex-start}
.alert{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:12px 14px;font-size:13px;display:flex;gap:10px}
.alert b{color:inherit}
.insights{margin:6px 0 0;padding-left:18px}
.insights li{margin:6px 0}
table.data{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
table.data th,table.data td{padding:6px 8px;border-bottom:1px solid var(--grid);text-align:left;vertical-align:top}
table.data th{color:var(--text-2);font-weight:600;position:sticky;top:0;background:var(--surface)}
table.data td.num,table.data th.num{text-align:right;font-variant-numeric:tabular-nums}
.table-scroll{max-height:420px;overflow:auto;margin-top:6px}
.table-view{max-height:290px;overflow:auto}
.tag{display:inline-block;font-size:11px;border-radius:4px;padding:0 5px;background:var(--surface-2);color:var(--text-2)}
.tag.d{background:var(--warn-bg);color:var(--warn-ink)}
.heat{display:grid;gap:2px;margin-top:12px;font-size:12px;overflow-x:auto}
.heat .hcell{height:26px;border-radius:3px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:11px}
.heat .hrow{white-space:nowrap;padding-right:8px;display:flex;align-items:center;color:var(--text-2)}
.heat .hhead{text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.hcell.r{background:var(--s1);color:#fff}.hcell.d{background:var(--s4);color:#0b0b0b}.hcell.n{background:var(--neutral-cell);color:var(--muted)}
#tooltip-html{position:fixed;pointer-events:none;z-index:50;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.12);display:none}
.toast{position:fixed;right:20px;bottom:20px;z-index:60;background:var(--text-1);color:var(--page);padding:10px 14px;border-radius:10px;max-width:420px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.2);display:none;white-space:pre-line}
.range-row{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.range-row input[type=range]{flex:1;min-width:160px}
.fx input{width:80px;border:1px solid var(--border);border-radius:6px;padding:3px 6px;background:var(--surface)}
.empty{color:var(--muted);font-size:13px;padding:30px 0;text-align:center}
.search{border:1px solid var(--border);border-radius:6px;padding:5px 8px;background:var(--surface);width:260px}
.section-title{grid-column:span 12;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:10px 0 -6px}
footer{color:var(--muted);font-size:12px;text-align:center;padding:20px}
@media print{header.top{position:static}.tools,.top-actions{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="top-row">
    <div class="brand">
      <h1>Indústria de Estética Médica — 2015 a 2025</h1>
      <div class="sub">Procedimentos (ISAPS), mercado, empresas e Brasil × EUA × Mundo</div>
    </div>
    <div class="top-actions">
      <span class="src-status" id="srcStatus"></span>
      <input type="file" id="fileInput" accept=".xlsx,.xlsm" hidden>
      <button class="btn primary" id="btnLoad" title="Carregar uma versão atualizada da planilha (.xlsx)">⤒ Carregar planilha</button>
      <button class="btn" id="btnReset" title="Voltar aos dados embutidos no arquivo">↺ Dados originais</button>
      <button class="btn" id="btnTheme" title="Alternar tema claro/escuro">◐ Tema</button>
    </div>
  </div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="filters" id="globalFilters"></div>
</header>
<main id="main"></main>
<footer>Dados: planilha “banco_dados_estetica_medica.xlsx”. Círculo vazado = valor derivado/estimado (fundo amarelo na planilha). Use “Tabela” em cada gráfico para ver os números.</footer>
<div id="tooltip-html"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* =========================================================================
   PARTE 1 — Leitura do .xlsx no navegador + modelo de dados
   ========================================================================= */

// ---------- utilidades ----------
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
const isNum = v => typeof v === 'number' && isFinite(v);
const colToNum = s => { let n = 0; for (const ch of s) n = n * 26 + (ch.charCodeAt(0) - 64); return n; };

// fundo amarelo = valor derivado/estimado (legenda da aba Leia-me)
function isYellowFill(rgb) {
  if (!rgb) return false;
  const h = rgb.length === 8 ? rgb.slice(2) : rgb;
  if (!/^[0-9a-f]{6}$/i.test(h)) return false;
  const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
  return r >= 230 && g >= 190 && b <= 215 && (r - b) >= 30;

// ---------- parser XLSX (OOXML) ----------
function parseXlsx(u8) {
  const files = fflate.unzipSync(u8);
  const dec = new TextDecoder('utf-8');
  const keyOf = p => Object.keys(files).find(k => k.toLowerCase() === p.toLowerCase());
  const xml = p => { const k = keyOf(p); return k ? new DOMParser().parseFromString(dec.decode(files[k]), 'application/xml') : null; };
  const byTag = (node, tag) => node ? Array.from(node.getElementsByTagName(tag)) : [];

  // shared strings
  const ss = [];
  const sst = xml('xl/sharedStrings.xml');
  byTag(sst, 'si').forEach(si => {
    // ignora textos fonéticos (rPh)
    let t = '';
    byTag(si, 't').forEach(tn => { if (tn.parentNode.nodeName !== 'rPh') t += tn.textContent; });
    ss.push(t);
  });

  // estilos -> preenchimento
  const fills = [], xfFill = [];
  const st = xml('xl/styles.xml');
  if (st) {
    const fillsEl = byTag(st, 'fills')[0];
    byTag(fillsEl, 'fill').forEach(f => {
      const pf = byTag(f, 'patternFill')[0];
      const fg = byTag(f, 'fgColor')[0];
      fills.push(pf && pf.getAttribute('patternType') === 'solid' && fg ? (fg.getAttribute('rgb') || '') : '');
    });
    const cx = byTag(st, 'cellXfs')[0];
    byTag(cx, 'xf').forEach(x => xfFill.push(+(x.getAttribute('fillId') || 0)));
  }

  // workbook + relações
  const wbx = xml('xl/workbook.xml');
  if (!wbx) throw new Error('Arquivo não parece ser um .xlsx válido (xl/workbook.xml ausente).');
  const rels = {};
  byTag(xml('xl/_rels/workbook.xml.rels'), 'Relationship').forEach(r => rels[r.getAttribute('Id')] = r.getAttribute('Target'));

  const sheets = {};
  byTag(wbx, 'sheet').forEach(sh => {
    const name = sh.getAttribute('name');
    let target = rels[attrEnds(sh, 'id')];
    if (!target) return;
    target = target.startsWith('/') ? target.slice(1) : 'xl/' + target.replace(/^\.\//, '');

    if (!doc) return;
    const cells = new Map();
    let maxRow = 0, maxCol = 0;
    byTag(doc, 'c').forEach(c => {
      const ref = c.getAttribute('r'); if (!ref) return;
      const m = /^([A-Z]+)(\d+)$/.exec(ref); if (!m) return;
      const col = colToNum(m[1]), row = +m[2];
      const t = c.getAttribute('t'); const s = +(c.getAttribute('s') || 0);
      const vEl = byTag(c, 'v')[0];
      const fEl = byTag(c, 'f')[0];
      const f = fEl && fEl.textContent ? fEl.textContent : null;
      let v = null;
      if (t === 's') v = vEl ? ss[+vEl.textContent] ?? null : null;
      else if (t === 'inlineStr') v = byTag(c, 't').map(x => x.textContent).join('');
      else if (t === 'str') v = vEl ? vEl.textContent : null;
      else if (t === 'b') v = vEl ? vEl.textContent === '1' : null;
      else if (t === 'e') v = null;
      else if (vEl && vEl.textContent !== '') { const n = Number(vEl.textContent); v = isFinite(n) ? n : vEl.textContent; }
      const fill = fills[xfFill[s]] || '';
      if (v === '' && f) v = null;
      if (v === null && !fill && !f) return;
      cells.set(row + ':' + col, { v, d: isYellowFill(fill), fill, f: v === null ? f : null });
      if (v !== null || f) { maxRow = Math.max(maxRow, row); maxCol = Math.max(maxCol, col); }
    });

      get(r, c) { return cells.get(r + ':' + c) || null; },
      val(r, c) { const x = cells.get(r + ':' + c); return x ? x.v : null; } };
  });
  evalMissingFormulas(sheets);
  return sheets;
}

// ---------- avaliador de fórmulas (só para células sem valor em cache) ----------
// Excel/LibreOffice/Google Sheets gravam o resultado das fórmulas; alguns geradores (ex.: scripts) não.
// Cobre aritmética, referências (inclusive entre abas) e IF/IFERROR/ISNUMBER/AND/OR/SUM/ROUND/ABS.
function evalMissingFormulas(sheets) {
  const ERR = { err: true };

      const k = sh.name + '!' + r + ':' + c;

    const re = /\s*(?:(\d+\.?\d*(?:[eE][+-]?\d+)?|\.\d+)|"((?:[^"]|"")*)"|((?:'[^']+'|[A-Za-z_][\w.]*)!)?\$?([A-Z]{1,3})\$?(\d+)(?![\w(])|([A-Za-z_][\w.]*)\s*\(|(<=|>=|<>|[-+*/^(),<>=&%]))/y;

      else toks.push({ t: 'o', v: m[7] });
    }
    let p = 0;
    const peek = () => toks[p], eat = v => { const x = toks[p]; if (!x || (v && x.v !== v)) throw ERR; p++; return x; };
    const N = x => { if (x === ERR) throw ERR; if (x === null || x === '') return 0; if (typeof x === 'boolean') return x ? 1 : 0; if (typeof x === 'number') return x; const n = Number(x); if (isFinite(n)) return n; throw ERR; };
    function expr() { let a = concat(); while (peek() && ['=', '<>', '<', '>', '<=', '>='].includes(peek().v) && peek().t === 'o') { const o = eat().v, b = concat();
      a = o === '=' ? a == b : o === '<>' ? a != b : o === '<' ? N(a) < N(b) : o === '>' ? N(a) > N(b) : o === '<=' ? N(a) <= N(b) : N(a) >= N(b); } return a; }
    function concat() { let a = add(); while (peek() && peek().v === '&') { eat(); a = String(a ?? '') + String(add() ?? ''); } return a; }
    function add() { let a = mul(); while (peek() && peek().t === 'o' && (peek().v === '+' || peek().v === '-')) { const o = eat().v; const b = mul(); a = o === '+' ? N(a) + N(b) : N(a) - N(b); } return a; }
    function mul() { let a = pow(); while (peek() && peek().t === 'o' && (peek().v === '*' || peek().v === '/')) { const o = eat().v; const b = pow(); if (o === '/' && N(b) === 0) throw ERR; a = o === '*' ? N(a) * N(b) : N(a) / N(b); } return a; }
    function pow() { let a = unary(); while (peek() && peek().v === '^') { eat(); a = Math.pow(N(a), N(unary())); } return a; }
    function unary() { if (peek() && peek().t === 'o' && (peek().v === '-' || peek().v === '+')) { const o = eat().v; const v = unary(); return o === '-' ? -N(v) : N(v); }
      let v = prim(); if (peek() && peek().v === '%') { eat(); v = N(v) / 100; } return v; }
    function args() { const out = []; if (peek() && peek().v === ')') { eat(); return out; }
      for (;;) { const start = p; out.push({ start }); skipArg(); if (peek() && peek().v === ',') { eat(); continue; } eat(')'); return out; } }
    function skipArg() { let depth = 0; while (p < toks.length) { const x = toks[p]; if (x.t === 'f' || x.v === '(') depth++; else if (x.v === ')') { if (depth === 0) return; depth--; } else if (x.v === ',' && depth === 0) return; p++; } }
    function evalAt(start) { const save = p; p = start; let v; try { v = expr(); } catch (e) { v = ERR; } p = save; return v; }
    function prim() {
      const x = eat();
      if (x.t === 'n' || x.t === 's') return x.v;
      if (x.t === 'r') { const target = x.sh ? byName[x.sh.toLowerCase()] : sh; if (!target) throw ERR; const v = cellValue(target, x.r, x.c); if (v === ERR) throw ERR; return v; }
      if (x.t === 'o' && x.v === '(') { const v = expr(); eat(')'); return v; }
      if (x.t === 'f') {
        const A = args(); const after = p; const ev = k => { const v = evalAt(A[k].start); p = after; return v; };
        const fn = x.v.replace(/^_XLFN\./, '');
        if (fn === 'IF') { const c = ev(0); if (c === ERR) throw ERR; const v = (c && c !== 0) ? (A[1] ? ev(1) : true) : (A[2] ? ev(2) : false); if (v === ERR) throw ERR; return v; }

        if (vals.some(v => v === ERR)) throw ERR;
        if (fn === 'AND') return vals.every(Boolean);
        if (fn === 'OR') return vals.some(Boolean);

      }

// ---------- leitura de tabelas por cabeçalho ----------
function findSheet(wb, name) {
  const n = norm(name);
  return Object.values(wb).find(s => norm(s.name) === n) || Object.values(wb).find(s => norm(s.name).includes(n)) || null;
}

// ---------- modelo ----------
function buildModel(wb) {
  const warn = [];
  const formulaFailures = wb.__formulaFailures || 0; delete wb.__formulaFailures;
  const M = { world: [], countries: [], procs: [], market: [], mmSeries: [], companies: [], abbvie: [], comp: [], anvisa: [],
    fontes: [], ressalvas: [], notes: {}, derivedStats: [], warnings: warn, sheetNames: Object.keys(wb) };

  // ISAPS_Global
  let sh = findSheet(wb, 'ISAPS_Global');
  if (!sh) warn.push('Aba ISAPS_Global não encontrada.');
  else {
    const h = findHeaderRow(sh, 'Ano');
    const C = colFinder(headerMap(sh, h));
    const c = { cir: C('Cirúrgicos'), nao: C('Não cirúrgicos'), tot: C('Total'), vof: C('Var. % oficial ISAPS'), tox: C('Toxina botulínica'),
      ah: C('Ácido hialurônico'), hom: C('% procedimentos em homens'), tipo: C('Tipo do dado'), obs: C('Observações'), fonte: C('Fonte') };
    for (let r = h + 1; r <= sh.maxRow; r++) {
      const ano = toYear(sh.val(r, 1)); if (!ano) { if (norm(sh.val(r, 1)).startsWith('indicadores')) break; continue; }
      const cir = num(sh, r, c.cir), nao = num(sh, r, c.nao);
      let tot = num(sh, r, c.tot); const calc = sumV(cir, nao);
      if (!has(tot)) tot = calc; // total publicado: mantém a marcação da própria célula
      M.world.push({ ano, cir, nao, tot, varOf: num(sh, r, c.vof), tox: num(sh, r, c.tox), ah: num(sh, r, c.ah), hom: num(sh, r, c.hom),
        tipo: txt(sh, r, c.tipo), obs: txt(sh, r, c.obs), fonte: txt(sh, r, c.fonte) });
    }
    M.world.sort((a, b) => a.ano - b.ano);
    M.world.forEach((w, i) => { const p = M.world[i - 1]; w.varCalc = p && has(p.tot) && has(w.tot) ? V(w.tot.v / p.tot.v - 1, w.tot.d || p.tot.d) : V(null); });
  }
  const worldBy = y => M.world.find(w => w.ano === y);

  // Paises_EUA_Brasil
  sh = findSheet(wb, 'Paises_EUA_Brasil');
  if (!sh) warn.push('Aba Paises_EUA_Brasil não encontrada.');
  else {
    const h = findHeaderRow(sh, 'Ano');
    const C = colFinder(headerMap(sh, h));
    const c = { et: C('EUA total'), ec: C('EUA cirúrgicos'), bt: C('Brasil total'), bc: C('Brasil cirúrgicos'), bn: C('Brasil não cirúrgicos'),
      mt: C('Mundo total'), bp: C('Brasil % do mundo'), ep: C('EUA % do mundo'), rt: C('Ranking Brasil (total)'), rc: C('Ranking Brasil (cirurgias)'),
      obs: C('Observações'), fonte: C('Fonte') };
    for (let r = h + 1; r <= sh.maxRow; r++) {
      const ano = toYear(sh.val(r, 1)); if (!ano) { if (norm(sh.val(r, 1)).startsWith('indicadores')) break; continue; }
      const w = worldBy(ano);
      const eua_tot = num(sh, r, c.et), eua_cir = num(sh, r, c.ec), br_tot = num(sh, r, c.bt), br_cir = num(sh, r, c.bc);
      let br_nao = subV(br_tot, br_cir); if (!has(br_nao)) br_nao = num(sh, r, c.bn);

  // Procedimentos
  sh = findSheet(wb, 'Procedimentos');
  if (!sh) warn.push('Aba Procedimentos não encontrada.');
  else {
    const h = findHeaderRow(sh, 'Ano');
    const C = colFinder(headerMap(sh, h));
    const c = { esc: C('Escopo'), tipo: C('Tipo'), proc: C('Procedimento'), rank: C('Ranking'), qtd: C('Quantidade'), vr: C('Var. % a.a. (reportada)', 'Var. %'), obs: C('Observação'), fonte: C('Fonte') };
    for (let r = h + 1; r <= sh.maxRow; r++) {
      const ano = toYear(sh.val(r, 1)); if (!ano) continue;
      const procRaw = txt(sh, r, c.proc).trim(); if (!procRaw) continue;
      M.procs.push({ ano, escopo: txt(sh, r, c.esc).trim() || 'Mundo', tipo: txt(sh, r, c.tipo).trim(), procRaw,
        proc: procRaw.replace(/\s*\(implante\)\s*$/i, ''), rank: num(sh, r, c.rank), qtd: num(sh, r, c.qtd), vr: num(sh, r, c.vr),
        obs: txt(sh, r, c.obs), fonte: txt(sh, r, c.fonte) });
    }
  }

  // Mercado_Projecoes
  sh = findSheet(wb, 'Mercado_Projecoes');
  if (!sh) warn.push('Aba Mercado_Projecoes não encontrada.');
  else {
    const h = findHeaderRow(sh, 'Consultoria');
    const C = colFinder(headerMap(sh, h));
    const c = { esc: C('Escopo'), geo: C('Geografia'), ab: C('Ano base'), vb: C('Valor base (US$ bi)', 'Valor base'), ap: C('Ano projeção'),
      vp: C('Valor projetado (US$ bi)', 'Valor projetado'), cr: C('CAGR reportado'), obs: C('Observação'), fonte: C('Fonte') };
    for (let r = h + 1; r <= sh.maxRow; r++) {
      const cons = txt(sh, r, 1).trim();
      if (!cons) { if (M.market.length) break; else continue; }
      const esc = txt(sh, r, c.esc).trim();
      const base = num(sh, r, c.vb), proj = num(sh, r, c.vp), ab = num(sh, r, c.ab).v, ap = num(sh, r, c.ap).v;
      const cagrCalc = has(base) && has(proj) && ab && ap && ap > ab ? V(Math.pow(proj.v / base.v, 1 / (ap - ab)) - 1) : V(null);
      M.market.push({ cons, escopo: esc, grupo: scopeGroup(esc), geo: txt(sh, r, c.geo).trim() || 'Global', anoBase: ab, base, anoProj: ap, proj,
        cagrRep: num(sh, r, c.cr), cagrCalc, obs: txt(sh, r, c.obs), fonte: txt(sh, r, c.fonte) });
    }
    // série histórica MarketsandMarkets
    const h2 = (() => { for (let r = h + 1; r <= sh.maxRow; r++) if (norm(sh.val(r, 1)) === 'ano' && norm(sh.val(r, 2)).startsWith('valor')) return r; return -1; })();
    if (h2 > 0) {
      const C2 = colFinder(headerMap(sh, h2));
      const cv = C2('Valor (US$ bi)', 'Valor'), ct = C2('Tipo'), cc = C2('Como foi obtido');
      for (let r = h2 + 1; r <= sh.maxRow; r++) {
        const ano = toYear(sh.val(r, 1)); if (!ano) continue;
        const v = num(sh, r, cv); const tipo = txt(sh, r, ct);
        if (/implic/i.test(tipo)) v.d = true;
        M.mmSeries.push({ ano, v, tipo, como: txt(sh, r, cc) });
      }
      M.mmSeries.sort((a, b) => a.ano - b.ano);
      const t = M.mmSeries.find(x => /mai|dez/i.test(x.como)); M.notes.mmRel = t ? t.como : '';
    }
  }

  // Empresas
  sh = findSheet(wb, 'Empresas');
  if (!sh) warn.push('Aba Empresas não encontrada.');
  else {
    const h = findHeaderRow(sh, 'Empresa');
    const C = colFinder(headerMap(sh, h));
    const c = { pais: C('País de origem'), sede: C('Sede'), marcas: C('Principais marcas estéticas', 'Principais marcas'), seg: C('Segmento'), met: C('Métrica'),
      val: C('Valor (mi)', 'Valor'), moeda: C('Moeda'), ano: C('Ano'), vr: C('Var. % a.a.'), obs: C('Observação'), fonte: C('Fonte') };
    for (let r = h + 1; r <= sh.maxRow; r++) {

      if (!emp) continue;

      const sub = emp.includes(' — ') || emp.includes(' - ');
      M.companies.push({ empresa: emp, parent: sub ? emp.split(/ — | - /)[0].trim() : emp, isSub: sub, pais: txt(sh, r, c.pais).trim(), sede: txt(sh, r, c.sede),
        marcas: txt(sh, r, c.marcas), segmento: txt(sh, r, c.seg), metrica: txt(sh, r, c.met), valor: num(sh, r, c.val), moeda: txt(sh, r, c.moeda).trim(),
        ano: num(sh, r, c.ano).v, vr: num(sh, r, c.vr), obs: txt(sh, r, c.obs), fonte: txt(sh, r, c.fonte) });
    }
  }

  // AbbVie_Serie
  sh = findSheet(wb, 'AbbVie_Serie');
  if (!sh) warn.push('Aba AbbVie_Serie não encontrada.');
  else {
    const h = findHeaderRow(sh, 'Ano');
    const C = colFinder(headerMap(sh, h));
    const c = { be: C('Botox Cosmetic EUA'), bi: C('Botox Cosmetic Internacional'), bg: C('Botox Cosmetic Global'), juv: C('Juvéderm Global', 'Juvéderm'),
      out: C('Outros estética'), tot: C('Total estética'), ter: C('Botox Terapêutico (referência)', 'Botox Terapêutico'), obs: C('Observação') };
    for (let r = h + 1; r <= sh.maxRow; r++) {
      const ano = toYear(sh.val(r, 1)); if (!ano) continue;
      const be = num(sh, r, c.be), bi = num(sh, r, c.bi);
      let bg = num(sh, r, c.bg); if (!has(bg)) bg = sumV(be, bi);
      const juv = num(sh, r, c.juv), out = num(sh, r, c.out);
      let tot = num(sh, r, c.tot); if (!has(tot)) tot = sumV(bg, juv, out);
      M.abbvie.push({ ano, be, bi, bg, juv, out, tot, ter: num(sh, r, c.ter), obs: txt(sh, r, c.obs) });
    }
    M.abbvie.sort((a, b) => a.ano - b.ano);
  }

  // Brasil_Comparativo
  sh = findSheet(wb, 'Brasil_Comparativo');
  if (!sh) warn.push('Aba Brasil_Comparativo não encontrada.');
  else {
    const h = findHeaderRow(sh, 'Indicador');
    const C = colFinder(headerMap(sh, h));
    const c = { br: C('Brasil'), eua: C('EUA'), mu: C('Mundo'), ano: C('Ano'), obs: C('Observação') };
    for (let r = h + 1; r <= sh.maxRow; r++) {
      const ind = txt(sh, r, 1).trim();
      if (!ind) { if (M.comp.length) break; continue; }
      M.comp.push({ ind, key: norm(ind), br: num(sh, r, c.br), eua: num(sh, r, c.eua), mu: num(sh, r, c.mu), ano: txt(sh, r, c.ano), obs: txt(sh, r, c.obs) });
    }
    const hm = findHeaderRow(sh, 'Marca', h + 1);
    if (hm > 0) {
      const Cm = colFinder(headerMap(sh, hm));
      const cr = Cm('Registro Anvisa'), ce = Cm('Empresa / origem', 'Empresa'), co = Cm('Observação');
      for (let r = hm + 1; r <= sh.maxRow; r++) {
        const m = txt(sh, r, 1).trim(); if (!m) continue;
        if (!txt(sh, r, cr)) { M.notes.anvisa = m; continue; }

      }
    }
  }

  // Fontes
  sh = findSheet(wb, 'Fontes');
  if (sh) {
    const h = findHeaderRow(sh, 'ID');
    for (let r = h + 1; r <= sh.maxRow; r++) { const id = txt(sh, r, 1).trim(); if (id) M.fontes.push({ id, desc: txt(sh, r, 2), url: txt(sh, r, 3) }); }
  }

  // Leia-me (ressalvas)
  sh = findSheet(wb, 'Leia-me');

  Object.values(wb).forEach(s => {
    if (/leia|fontes/i.test(norm(s.name))) return;
    let tot = 0, der = 0;
    for (let r = 1; r <= s.maxRow; r++) {
      const a = s.get(r, 1);
      const isHeader = a && a.fill && /1F3864$/i.test(a.fill);
      if (!isHeader) continue;
      const hm = headerMap(s, r);
      const skipCols = new Set(Object.entries(hm).filter(([k]) => /^ano/.test(k)).map(([, c]) => c));
      let rr = r + 1;
      for (; rr <= s.maxRow; rr++) {
        const lead = s.val(rr, 1);
        if (lead === null || lead === '') break;
        for (let c = 2; c <= s.maxCol; c++) {
          if (skipCols.has(c)) continue;
          const cell = s.get(rr, c);
          if (cell && isNum(cell.v)) { tot++; if (cell.d) der++; }
        }
      }
      r = rr;
    }
    if (tot) M.derivedStats.push({ aba: s.name, tot, der });
  });

  if (formulaFailures) warn.push(`${formulaFailures} fórmula(s) sem valor calculado não puderam ser avaliadas — abra e salve a planilha no Excel para gravar os resultados.`);
  if (!M.world.length) warn.push('Nenhum ano encontrado em ISAPS_Global — confira se o cabeçalho “Ano” está na coluna A.');
  return M;
}

function scopeGroup(esc) {
  const n = norm(esc);
  if (/gasto/.test(n)) return 'Gasto de pacientes';
  if (/neurotox/.test(n)) return 'Neurotoxinas';
  if (/servic|amplo|clinicas/.test(n)) return 'Amplo (inclui serviços)';
  if (/produto/.test(n) || n === 'estetica medica') return 'Produtos (injetáveis, aparelhos, implantes)';
  if (/dispositiv/.test(n)) return 'Dispositivos';
  return 'Produtos (injetáveis, aparelhos, implantes)';
}

// ---------- formatação pt-BR ----------
const nf = (d = 0) => new Intl.NumberFormat('pt-BR', { minimumFractionDigits: d, maximumFractionDigits: d });

function fCompact(v, d = 1) {
  if (!isNum(v)) return '—';
  const a = Math.abs(v);
  if (a >= 1e9) return nf(d).format(v / 1e9) + ' bi';
  if (a >= 1e6) return nf(d).format(v / 1e6) + ' mi';
  if (a >= 1e4) return nf(0).format(v / 1e3) + ' mil';
  return nf(0).format(v);
}
const fPct = (v, d = 1) => isNum(v) ? nf(d).format(v * 100) + '%' : '—';
const fPctS = (v, d = 1) => isNum(v) ? (v > 0 ? '+' : v < 0 ? '−' : '') + nf(d).format(Math.abs(v) * 100) + '%' : '—';
const fUsdBi = v => isNum(v) ? 'US$ ' + nf(v < 1 ? 2 : 1).format(v) + ' bi' : '—';
const fUsdMi = v => isNum(v) ? 'US$ ' + nf(0).format(v) + ' mi' : '—';

// ---------- DOM ----------
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style') e.setAttribute('style', v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) e.append(k instanceof Node ? k : document.createTextNode(String(k)));
  return e;
}
const $ = s => document.querySelector(s);

// ---------- cores (tokens CSS) ----------
function T() {
  const s = getComputedStyle(document.documentElement);
  const g = n => s.getPropertyValue(n).trim();
  return { surface: g('--surface'), text1: g('--text-1'), text2: g('--text-2'), muted: g('--muted'), grid: g('--grid'), axis: g('--axis'),
    s1: g('--s1'), s2: g('--s2'), s3: g('--s3'), s4: g('--s4'), good: g('--good'), bad: g('--bad') };
}
// cor fixa por entidade (nunca por ranking)
const GEO_COLOR = { 'Mundo': 's1', 'EUA': 's2', 'Brasil': 's3' };
const TYPE_COLOR = { 'Cirúrgico': 's1', 'Não cirúrgico': 's2' };
const col = k => T()[k];
const alpha = (hex, a) => { const h = hex.replace('#', ''); const r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16); return `rgba(${r},${g},${b},${a})`; };

// ---------- estado ----------
const S = {
  M: null, tab: 'overview', from: 2015, to: 2025, years: [],
  geos: new Set(['Mundo', 'EUA', 'Brasil']), tipos: new Set(['Cirúrgico', 'Não cirúrgico']), onlyRep: false,
  procAno: null, procEscopo: 'Mundo', procTipo: 'Todos',
  mktGeo: 'Global', mktGrupo: 'Produtos (injetáveis, aparelhos, implantes)', mktCons: null,

  potRate: null, fontesQ: ''
};
// valor respeitando o filtro "só reportados"
const g = o => (o && isNum(o.v) && !(S.onlyRep && o.d)) ? o.v : null;
const inRange = y => y >= S.from && y <= S.to;

// ---------- cards ----------
const charts = [];
function destroyCharts() { while (charts.length) { try { charts.pop().destroy(); } catch (e) {} } }

function card(parent, { title, q, span = 6, height = '', note = '', legend = null, table = true }) {
  const c = el('section', { class: `card span-${span}` });
  const tools = el('div', { class: 'tools' });
  c.append(el('div', { class: 'card-h' }, el('div', {}, el('h3', { text: title }), q ? el('div', { class: 'q', text: q }) : null), tools));
  const wrap = el('div', { class: 'chart-wrap ' + height });
  const canvas = el('canvas', { role: 'img', 'aria-label': title });
  wrap.append(canvas);
  const tv = el('div', { class: 'table-view', hidden: true });
  c.append(wrap, tv);
  if (legend) c.append(legendEl(legend));
  if (note) c.append(el('div', { class: 'note', text: note }));
  parent.append(c);
  const obj = { el: c, canvas, wrap, tv, tools, chart: null, tableFmt: null };
  if (table) {
    const b = el('button', { class: 'btn small', text: 'Tabela', title: 'Alternar entre gráfico e tabela', 'aria-pressed': 'false' });
    b.addEventListener('click', () => {
      const show = tv.hidden;
      tv.hidden = !show; wrap.hidden = show; b.setAttribute('aria-pressed', String(show)); b.textContent = show ? 'Gráfico' : 'Tabela';
      if (show) renderTableView(obj);
    });
    tools.append(b);
  }
  return obj;
}
function legendEl(items) {
  const L = el('div', { class: 'legend' });
  items.forEach(it => {
    const sw = el('i', { class: it.kind || '' });
    if (it.color) sw.style.background = it.color;
    L.append(el('span', {}, sw, it.label));
  });
  return L;
}
function plainCard(parent, { title, q, span = 6 }) {
  const c = el('section', { class: `card span-${span}` });
  c.append(el('div', { class: 'card-h' }, el('div', {}, el('h3', { text: title }), q ? el('div', { class: 'q', text: q }) : null)));
  parent.append(c);
  return c;
}
function kpi(parent, { label, value, delta = null, dir = 0, flag = '', hero = false, span = 3, sub = '' }) {
  const c = el('section', { class: `card span-${span} kpi` },
    el('div', { class: 'lbl', text: label }),
    el('div', { class: 'val' + (hero ? ' hero' : ''), text: value }),
    delta ? el('div', { class: 'delta ' + (dir > 0 ? 'up' : dir < 0 ? 'down' : ''), text: delta }) : null,
    sub ? el('div', { class: 'delta', text: sub }) : null,
    flag ? el('div', { class: 'flag', text: flag }) : null);
  parent.append(c);
  return c;
}

// tabela gêmea de cada gráfico (gerada a partir dos dados do próprio gráfico)
function renderTableView(obj) {
  const ch = obj.chart; obj.tv.textContent = '';

// ---------- helpers de série ----------
const W = () => S.M.world.filter(w => inRange(w.ano));
const CN = () => S.M.countries.filter(c => inRange(c.ano));
const firstLast = (rows, f) => { const ok = rows.filter(r => g(f(r)) !== null); return [ok[0], ok[ok.length - 1]]; };
const growth = (a, b) => isNum(a) && isNum(b) && a ? b / a - 1 : null;
const cagr = (a, b, n) => isNum(a) && isNum(b) && a > 0 && n > 0 ? Math.pow(b / a, 1 / n) - 1 : null;

const compRow = (re, ano) => S.M.comp.find(r => re.test(r.key) && (!ano || r.ano === String(ano)));
const usdOf = c => {
  const v = g(c.valor); if (v === null) return null;
  const m = norm(c.moeda);
  if (m.includes('us')) return v;
  if (m.includes('€') || m.includes('eur')) return v * (c.ano && c.ano <= 2022 ? S.fx.EUR_2022 : S.fx.EUR);
  if (m.includes('krw') || m.includes('won')) return v / S.fx.KRW;
  return null;
};

const PAGES = {};

/* ---------------- 1. VISÃO GERAL ---------------- */
PAGES.overview = (root) => {
  const w = W();
  const [f, l] = firstLast(w, r => r.tot);
  const prev = l && w.filter(r => r.ano < l.ano && g(r.tot) !== null).pop();
  if (!l) { root.append(el('div', { class: 'card span-12 empty', text: 'Sem dados de procedimentos no período selecionado.' })); return; }
  const flag = o => o && o.d ? 'contém valor derivado' : '';
  kpi(root, { span: 4, hero: true, label: `Procedimentos estéticos no mundo (${l.ano})`, value: fCompact(g(l.tot)),
    delta: prev ? `${fPctS(growth(g(prev.tot), g(l.tot)))} vs ${prev.ano}` : '', dir: prev ? Math.sign(g(l.tot) - g(prev.tot)) : 0, flag: flag(l.tot) });
  const c1 = cagr(g(f.tot), g(l.tot), l.ano - f.ano);
  kpi(root, { span: 2, label: 'CAGR mundial', value: fPct(c1), sub: `${f.ano}→${l.ano}` });
  const mixL = g(l.nao) !== null && g(l.tot) ? g(l.nao) / g(l.tot) : null, mixF = g(f.nao) !== null && g(f.tot) ? g(f.nao) / g(f.tot) : null;
  kpi(root, { span: 2, label: `% não cirúrgico (${l.ano})`, value: fPct(mixL), sub: `${f.ano}: ${fPct(mixF)}`, flag: flag(l.nao) });

  const rkt = [...cn].reverse().find(c => g(c.rank_tot) !== null);
  kpi(root, { span: 2, label: 'Brasil no ranking de cirurgias', value: rk ? g(rk.rank_cir) + 'º' : '—', sub: rk ? `${rk.ano} · total: ${rkt ? g(rkt.rank_tot) + 'º' : '—'}` : '' });
  const pc = [...cn].reverse().find(c => g(c.br_pct_cir) !== null);
  kpi(root, { span: 2, label: 'Brasil: % das cirurgias do mundo', value: pc ? fPct(g(pc.br_pct_cir)) : '—', sub: pc ? String(pc.ano) : '', flag: pc ? flag(pc.br_pct_cir) : '' });

  lineChart(c, { labels: w.map(r => String(r.ano)), datasets: [lineDS('Mundo', w.map(r => r.tot), 's1', { _noEnd: true, fill: true, backgroundColor: alpha(T().s1, .10) })],
    fmt: v => fCompact(v), end: false, marks: [{ x: '2020', text: 'COVID-19' }] });

  const ic = plainCard(root, { title: 'Principais leituras', q: 'Calculadas a partir dos dados e do filtro atual', span: 4 });
  const ul = el('ul', { class: 'insights' }); ic.append(ul);
  insights().forEach(t => ul.append(el('li', { text: t })));

  // índice base 100
  const ci = card(root, { title: 'Crescimento comparado (índice, ano-base = 100)', q: 'Brasil, EUA e Mundo na mesma escala: quem cresce mais rápido?', span: 12,
    legend: [...S.geos].map(gx => ({ color: col(GEO_COLOR[gx]), label: gx })),
    note: 'EUA: salto entre 2020 e 2022 reflete mudança de método/amostra da ISAPS, não necessariamente demanda real.' });
  const series = { Mundo: w.map(r => r.tot), EUA: w.map(r => (S.M.countries.find(c => c.ano === r.ano) || {}).eua_tot), Brasil: w.map(r => (S.M.countries.find(c => c.ano === r.ano) || {}).br_tot) };
  const geos = [...S.geos];

function insights() {
  const out = [], w = W(), cn = CN();
  const [f, l] = firstLast(w, r => r.nao);
  if (f && l && f !== l && g(f.tot) && g(l.tot)) out.push(`Não cirúrgicos eram ${fPct(g(f.nao) / g(f.tot))} do total em ${f.ano} e ${fPct(g(l.nao) / g(l.tot))} em ${l.ano}.`);
  const withR = cn.filter(c => g(c.rank_cir) !== null);
  if (withR.length) out.push(`Brasil foi 1º do mundo em cirurgias em ${withR.filter(c => g(c.rank_cir) === 1).length} de ${withR.length} anos com dado (${withR[0].ano}–${withR[withR.length - 1].ano}).`);
  const gr = k => { const [a, b] = firstLast(cn, c => c[k]); return a && b && a !== b ? [growth(g(a[k]), g(b[k])), a.ano, b.ano] : null; };
  const gm = (() => { const [a, b] = firstLast(w, r => r.tot); return a && b && a !== b ? [growth(g(a.tot), g(b.tot)), a.ano, b.ano] : null; })();
  const gb = gr('br_tot'), ge = gr('eua_tot');
  if (gm && gb) out.push(`Crescimento acumulado: Mundo ${fPctS(gm[0], 0)} (${gm[1]}–${gm[2]}), EUA ${ge ? fPctS(ge[0], 0) : '—'}, Brasil ${fPctS(gb[0], 0)} — o Brasil cresce menos que o mundo; a expansão global vem dos não cirúrgicos e da Ásia.`);
  const ab = S.M.abbvie.filter(a => inRange(a.ano));
  const [b1, b2] = firstLast(ab, a => a.bg), [j1, j2] = firstLast(ab, a => a.juv);
  if (b1 && b2 && b1 !== b2 && j1 && j2 && j1 !== j2) out.push(`AbbVie: Botox Cosmetic ${fPctS(growth(g(b1.bg), g(b2.bg)), 0)} (${b1.ano}→${b2.ano}) vs Juvéderm ${fPctS(growth(g(j1.juv), g(j2.juv)), 0)} (${j1.ano}→${j2.ano}) — toxina resiliente, ácido hialurônico em queda.`);
  const br = S.M.market.filter(m => m.geo === 'Brasil').flatMap(m => [g(m.base), g(m.proj)]).filter(isNum);
  if (br.length > 1) out.push(`Estimativas de mercado para o Brasil vão de ${fUsdBi(Math.min(...br))} a ${fUsdBi(Math.max(...br))}: o número depende da definição de “mercado”.`);
  if (S.M.notes.concentracao) out.push(S.M.notes.concentracao.replace(/\s*\(.*?S\d+\)\.?$/, '.'));
  return out;
}

  const wOf = (y, k) => (S.M.world.find(w => w.ano === y) || {})[k] || V(null), aOf = (y, k) => (S.M.abbvie.find(a => a.ano === y) || {})[k] || V(null);

  // gasto implícito por procedimento não cirúrgico
  const mm = S.M.market.filter(m => /marketsandmarkets/i.test(m.cons) && /^Produtos/.test(m.grupo));
  const nearest = (rows, y, k) => { const ok = rows.filter(r => g(r[k]) !== null); if (!ok.length) return null; return ok.reduce((b, r) => Math.abs(r.ano - y) < Math.abs(b.ano - y) ? r : b); };

  // potencial de penetração
  const pr = compRow(/^procedimentos por 1\.000/), pop = compRow(/^populacao/), tot = compRow(/^procedimentos totais/);
  const cpot = plainCard(root, { title: 'Cenário: Brasil com outra taxa de penetração', q: 'Quantos procedimentos o Brasil faria com X procedimentos por 1.000 habitantes?', span: 6 });
  if (pr && pop && g(pop.br) && g(tot?.br)) {
    const ref = g(pr.eua) ?? 18; if (!isNum(S.potRate)) S.potRate = Math.round(ref * 10) / 10;
    const out = el('div'); const lab = el('b', { text: fDec(S.potRate, 1) });
    const rng = el('input', { type: 'range', min: 5, max: 40, step: .5, value: S.potRate, 'aria-label': 'Procedimentos por 1.000 habitantes' });
    const draw = () => {
      const atual = g(tot.br), cen = S.potRate * g(pop.br) * 1000; out.textContent = '';
      out.append(el('div', { class: 'grid', style: 'margin-top:10px' },
        el('div', { class: 'span-4 kpi' }, el('div', { class: 'lbl', text: `Atual (${tot.ano})` }), el('div', { class: 'val', text: fCompact(atual) }), el('div', { class: 'delta', text: `${fDec(g(pr.br), 1)} por 1.000 hab.` })),
        el('div', { class: 'span-4 kpi' }, el('div', { class: 'lbl', text: 'Cenário' }), el('div', { class: 'val', text: fCompact(cen) }), el('div', { class: 'delta', text: `${fDec(S.potRate, 1)} por 1.000 hab.` })),
        el('div', { class: 'span-4 kpi' }, el('div', { class: 'lbl', text: 'Diferença' }), el('div', { class: 'val', text: (cen >= atual ? '+' : '−') + fCompact(Math.abs(cen - atual)) }), el('div', { class: 'delta ' + (cen >= atual ? 'up' : 'down'), text: fPctS(cen / atual - 1, 0) }))));
    };
    rng.addEventListener('input', () => { S.potRate = +rng.value; lab.textContent = fDec(S.potRate, 1); draw(); });
    cpot.append(el('div', { class: 'range-row' }, el('span', { text: 'Taxa-alvo:' }), rng, lab,
      el('button', { class: 'btn small', text: `= EUA (${fDec(ref, 1)})`, onclick: () => { S.potRate = Math.round(ref * 10) / 10; rng.value = S.potRate; lab.textContent = fDec(S.potRate, 1); draw(); } })), out,
      el('div', { class: 'note', text: `População ${fDec(g(pop.br), 0)} mi (aprox.). Cenário hipotético — só procedimentos por cirurgiões plásticos.` }));
    draw();
  } else cpot.append(el('div', { class: 'empty', text: 'Indicadores de população/penetração não encontrados.' }));
};

/* ---------------- 8. METODOLOGIA & FONTES ---------------- */
PAGES.method = (root) => {
  const M = S.M;
  if (M.warnings.length) root.append(el('div', { class: 'alert span-12' }, el('b', { text: 'Avisos da leitura: ' }), M.warnings.join(' ')));
  // heatmap de cobertura
  const years = S.years;
  const rowsDef = [
    ['Mundo — total', y => (M.world.find(w => w.ano === y) || {}).tot], ['Mundo — cirúrgicos', y => (M.world.find(w => w.ano === y) || {}).cir],
    ['Mundo — não cirúrgicos', y => (M.world.find(w => w.ano === y) || {}).nao], ['Mundo — toxina', y => (M.world.find(w => w.ano === y) || {}).tox],
    ['Mundo — ácido hialurônico', y => (M.world.find(w => w.ano === y) || {}).ah], ['Mundo — % homens', y => (M.world.find(w => w.ano === y) || {}).hom],
    ['EUA — total', y => (M.countries.find(c => c.ano === y) || {}).eua_tot], ['EUA — cirúrgicos', y => (M.countries.find(c => c.ano === y) || {}).eua_cir],
    ['Brasil — total', y => (M.countries.find(c => c.ano === y) || {}).br_tot], ['Brasil — cirúrgicos', y => (M.countries.find(c => c.ano === y) || {}).br_cir],
    ['Brasil — ranking cirurgias', y => (M.countries.find(c => c.ano === y) || {}).rank_cir],
    ['Procedimentos (Mundo)', y => { const n = M.procs.filter(p => p.ano === y && p.escopo === 'Mundo').length; return n ? V(n) : V(null); }],
    ['Procedimentos (Brasil)', y => { const n = M.procs.filter(p => p.ano === y && p.escopo === 'Brasil').length; return n ? V(n) : V(null); }],
    ['AbbVie — Botox global', y => (M.abbvie.find(a => a.ano === y) || {}).bg], ['AbbVie — Juvéderm', y => (M.abbvie.find(a => a.ano === y) || {}).juv]];
  const hc = plainCard(root, { title: 'Mapa de cobertura dos dados', q: 'R = reportado pela fonte · D = derivado/estimado · vazio = sem dado. Nas linhas “Procedimentos”, o número é a quantidade de itens no ano.', span: 12 });
  const hg = el('div', { class: 'heat', style: `grid-template-columns: minmax(170px,auto) repeat(${years.length}, minmax(34px,1fr))` });
  hg.append(el('div', {}), ...years.map(y => el('div', { class: 'hhead', text: y })));
  rowsDef.forEach(([lab, f]) => { hg.append(el('div', { class: 'hrow', text: lab }));
    years.forEach(y => { const o = f(y); const isCount = lab.startsWith('Procedimentos'); const st = !o || !isNum(o.v) ? 'n' : o.d ? 'd' : 'r';
      hg.append(el('div', { class: 'hcell ' + st, title: `${lab} · ${y}: ${st === 'n' ? 'sem dado' : st === 'd' ? 'derivado' : 'reportado'}`, text: st === 'n' ? '' : isCount ? String(o.v) : st.toUpperCase() })); }); });
  hc.append(hg, legendEl([{ kind: 'box', color: T().s1, label: 'Reportado' }, { kind: 'box', color: T().s4, label: 'Derivado/estimado' }, { kind: 'box', color: getComputedStyle(document.documentElement).getPropertyValue('--neutral-cell'), label: 'Sem dado' }]));

  // % derivados por aba
  const ds = M.derivedStats.filter(d => d.tot).sort((a, b) => b.der / b.tot - a.der / a.tot);
  const c2 = card(root, { title: 'Valores derivados por aba', q: '% das células numéricas com fundo amarelo (derivado/estimado)', span: 6, height: 'short' });
  barChart(c2, { labels: ds.map(d => d.aba), horizontal: true, fmt: v => fPct(v, 0), labelsOn: (v, k) => `${fPct(v, 0)} (${ds[k].der}/${ds[k].tot})`, padRight: 90, xExtra: { suggestedMax: .3 },
    datasets: [{ label: '% derivado', data: ds.map(d => d.der / d.tot), backgroundColor: T().s4 }] });

  const cr = plainCard(root, { title: 'Ressalvas da base', q: M.notes.montagem || '', span: 6 });
  const ul = el('ul', { class: 'insights' }); M.ressalvas.forEach(r => ul.append(el('li', {}, el('b', { text: r.t + ' — ' }), r.d))); cr.append(ul);

  const cf = plainCard(root, { title: `Fontes (${M.fontes.length})`, q: 'IDs usados na coluna “Fonte” das outras abas', span: 12 });
  const search = el('input', { class: 'search', type: 'search', placeholder: 'Buscar fonte, ID ou domínio…', value: S.fontesQ });
  const tbody = el('tbody');
  const draw = () => { tbody.textContent = ''; const q = norm(S.fontesQ);
    M.fontes.filter(f => !q || norm(f.id + ' ' + f.desc + ' ' + f.url).includes(q)).forEach(f => {
      const link = /^https?:\/\//i.test(f.url) ? el('a', { href: f.url, target: '_blank', rel: 'noopener noreferrer', text: f.url.replace(/^https?:\/\/(www\.)?/, '').slice(0, 70) + (f.url.length > 78 ? '…' : '') }) : el('span', { text: f.url });
      tbody.append(el('tr', {}, el('td', { text: f.id }), el('td', { text: f.desc }), el('td', {}, link))); }); };
  search.addEventListener('input', () => { S.fontesQ = search.value; draw(); });
  cf.append(search, el('div', { class: 'table-scroll' }, el('table', { class: 'data' }, el('thead', {}, el('tr', {}, el('th', { text: 'ID' }), el('th', { text: 'Descrição' }), el('th', { text: 'Link' }))), tbody)));
  draw();
};

/* ---------------- BOOT + CARREGAR PLANILHA ---------------- */
const LS_KEY = 'dash_estetica_xlsx_v1';
function b64ToU8(b64) { const bin = atob(b64); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u; }
function u8ToB64(u8) { let s = ''; const ch = 0x8000; for (let i = 0; i < u8.length; i += ch) s += String.fromCharCode.apply(null, u8.subarray(i, i + ch)); return btoa(s); }

function loadWorkbook(u8, label) {
  const wb = parseXlsx(u8);
  const M = buildModel(wb);
  if (!M.world.length && !M.market.length && !M.companies.length) throw new Error('Nenhuma das abas esperadas foi reconhecida. ' + M.warnings.join(' '));
  S.M = M;
  S.years = [...new Set([...M.world.map(w => w.ano), ...M.countries.map(c => c.ano)])].sort((a, b) => a - b);
  S.from = S.years[0]; S.to = S.years[S.years.length - 1];
  S.procAno = null; S.mktCons = null; S.empPais = null; S.potRate = null;
  $('#srcStatus').textContent = label;
  rerender();
  return M;
}
function boot() {
  const saved = (() => { try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { return null; } })();
  const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  const theme = (() => { try { return localStorage.getItem(LS_KEY + '_theme'); } catch (e) { return null; } })() || (prefersDark ? 'dark' : 'light');
  document.documentElement.dataset.theme = theme;
  applyChartDefaults();
  let ok = false;
  if (saved && saved.b64) { try { loadWorkbook(b64ToU8(saved.b64), `Dados: ${saved.name} (carregado em ${saved.at})`); ok = true; } catch (e) { console.warn(e); } }
  if (!ok) loadWorkbook(b64ToU8(window.EMBEDDED_XLSX_B64), 'Dados: planilha original embutida (nov/2026)');

  $('#btnLoad').addEventListener('click', () => $('#fileInput').click());
  $('#fileInput').addEventListener('change', async ev => {
    const f = ev.target.files[0]; ev.target.value = ''; if (!f) return;
    try {
      const u8 = new Uint8Array(await f.arrayBuffer());
      const at = new Date().toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' });
      const M = loadWorkbook(u8, `Dados: ${f.name} (carregado em ${at})`);
      try { localStorage.setItem(LS_KEY, JSON.stringify({ b64: u8ToB64(u8), name: f.name, at })); } catch (e) {}
      toast(`Planilha “${f.name}” carregada: ${M.world.length} anos ISAPS, ${M.procs.length} procedimentos, ${M.market.length} estimativas, ${M.companies.length} empresas.` + (M.warnings.length ? `\nAvisos: ${M.warnings.join(' ')}` : ''), 7000);
    } catch (e) { console.warn(e); toast('Não consegui ler a planilha: ' + (/zip/i.test(e.message) ? 'o arquivo não é um .xlsx válido' : e.message) + '\nOs dados anteriores foram mantidos.', 8000); }
  });
  $('#btnReset').addEventListener('click', () => { try { localStorage.removeItem(LS_KEY); } catch (e) {} loadWorkbook(b64ToU8(window.EMBEDDED_XLSX_B64), 'Dados: planilha original embutida (nov/2026)'); toast('Dados originais restaurados.'); });
  $('#btnTheme').addEventListener('click', () => { const n = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = n;
    try { localStorage.setItem(LS_KEY + '_theme', n); } catch (e) {} applyChartDefaults(); rerender(); });
}
document.addEventListener('DOMContentLoaded', boot);

</script>
